<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Rifa para mi año de colab</title>
<meta name="description" content="300 boletos de $300. Participa por un Garmin Forerunner o tarjetas de regalo de Lululemon y ayuda a Paulina a vivir su año como colaboradora.">
<meta property="og:title" content="Rifa · Garmin Forerunner y Lululemon">
<meta property="og:description" content="Boletos de $300. Sorteo en vivo la primera semana de enero en @paulinavales.">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style id="st">
/* Layout: una columna estilo app — barra de aviso, hero tipográfico enorme, boleto-premio inclinado, progreso + contador, foto con etiqueta, premios, pasos, compra en 3 pasos, reglas en acordeón. */
:root{
  --bg:#f8f9fc; --card:#ffffff; --soft:#eef1f7; --ink:#1f2b4f; --muted:#6b7390; --line:#e1e5ee;
  --wine:#8b2630; --wine-soft:#f3e6e9; --navy:#1f2b4f; --on-navy:#ffffff; --gold:#e7c46a;
  --display:"Plus Jakarta Sans", "DM Sans", system-ui, sans-serif;
  --body:"DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --serif:"DM Serif Display", Georgia, serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1322; --card:#161d31; --soft:#1c2540; --ink:#e9ecf6; --muted:#9aa3bf; --line:#283152;
  --wine:#e0707c; --wine-soft:#3a1f28; --navy:#2a3a6b; --on-navy:#ffffff; --gold:#e7c46a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1322; --card:#161d31; --soft:#1c2540; --ink:#e9ecf6; --muted:#9aa3bf; --line:#283152;
  --wine:#e0707c; --wine-soft:#3a1f28; --navy:#2a3a6b; --on-navy:#ffffff; --gold:#e7c46a; color-scheme:dark}
*{box-sizing:border-box}
body{background:#fff;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.65}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:var(--dw,800);letter-spacing:var(--dls,-.035em);text-transform:var(--dt,none);line-height:1.02;text-wrap:balance;margin:0}
h2{font-size:clamp(36px,6vw,58px)}
.w{color:var(--wine)}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.2em;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:10px;margin-bottom:18px}
.eyebrow.dot::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--wine)}
section{padding-block:64px}
.lead{color:var(--muted);font-size:19px;max-width:40ch}
a{color:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;border:0;border-radius:var(--rb,10px);padding:16px 26px;font:700 16px var(--body);cursor:pointer;text-decoration:none;background:var(--wine);color:#fff;transition:transform .15s}
.btn:hover{transform:translateY(-1px)}
.btn.navy{background:var(--navy);color:var(--on-navy)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn svg{width:18px;height:18px}
:focus-visible{outline:3px solid var(--wine);outline-offset:3px}

/* top */
.announce{background:var(--navy);color:var(--on-navy);text-align:center;font-size:14px;letter-spacing:.04em;padding-block:10px}
.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:20px;border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:12px;line-height:1.15;text-decoration:none}
.logo .mark{width:48px;height:48px;border-radius:50%;background:var(--soft);display:grid;place-items:center;color:var(--ink);flex:none}
.logo small{display:block;font-size:15px;color:var(--ink)}
.logo b{font-family:var(--display);font-size:17px}
.nav .btn{padding:12px 18px;font-size:15px}

/* hero */
.hero{padding-block:56px 32px;display:grid;grid-template-columns:1.1fr 1fr;gap:48px;align-items:center}
.hero h1{font-size:clamp(54px,9vw,104px)}
.hero .lead{margin:24px 0 32px}
.buyrow{display:flex;align-items:center;gap:28px;flex-wrap:wrap}
.price b{font-family:var(--display);font-size:42px;letter-spacing:-.03em;line-height:1;display:block}
.price span{color:var(--muted);font-size:15px}
.org{display:flex;align-items:center;gap:14px;margin-top:32px}
.org .av{width:56px;height:56px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1px var(--line);background:var(--soft) center/cover;flex:none}
.org p{margin:0;font-size:15px;color:var(--muted);line-height:1.4}
.org p b{color:var(--ink)}

/* prize ticket */
.prize-wrap{position:relative;padding:28px 12px 40px}
.prize-wrap .note-hand{font-family:var(--serif);font-style:italic;color:var(--muted);font-size:20px;line-height:1.1;position:absolute;left:-6px;top:-6px;transform:rotate(-6deg);z-index:2}
.pticket{position:relative;transform:rotate(3deg);background:var(--navy);color:var(--on-navy);border-radius:var(--r,18px);overflow:hidden;box-shadow:16px 18px 0 var(--soft)}
.pticket .top{padding:28px 28px 20px;position:relative}
.pticket .tag{font-size:12px;letter-spacing:.24em;text-transform:uppercase;opacity:.9;display:flex;justify-content:space-between}
.pticket .big{font-family:var(--display);font-weight:var(--dw,800);text-transform:var(--dt,none);font-size:clamp(44px,7vw,68px);line-height:.92;margin:28px 0 10px;text-shadow:3px 3px 0 var(--wine)}
.pticket .sub{font-family:var(--body);font-size:22px;opacity:.95}
.pticket .watch{position:absolute;right:-10px;top:30px;width:min(46%,220px);height:auto;mix-blend-mode:lighten}
.pticket .stub{background:var(--card);color:var(--ink);border-top:2px dashed var(--line);padding:18px 28px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pticket .stub b{font-family:var(--display);font-size:20px;display:block;line-height:1.2}
.pticket .stub span{font-size:13px;color:var(--muted)}
.badge{position:absolute;right:-4px;bottom:0;width:118px;height:118px;border-radius:50%;background:var(--wine);color:#fff;border:6px solid var(--bg);display:grid;place-items:center;text-align:center;font:800 12px/1.25 var(--display);letter-spacing:.1em;text-transform:uppercase;transform:rotate(10deg);z-index:3}

/* progress */
.stats{border-block:1px solid var(--line);padding-block:28px;display:grid;gap:22px}
.sold-line{display:flex;gap:16px;align-items:center}
.sold-line svg{width:38px;flex:none;color:var(--ink)}
.sold-line b{font-family:var(--display);font-size:22px}
.sold-line p{margin:0;font-size:20px;line-height:1.3}
.sold-line small{display:block;color:var(--muted);font-size:15px}
.bar{height:10px;border-radius:999px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--navy);border-radius:999px}
.cd{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.cd .lbl{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.cd .nums{display:flex;gap:clamp(18px,4vw,40px)}
.cd .nums div{text-align:center}
.cd .nums b{font-family:var(--display);font-size:clamp(34px,6vw,48px);letter-spacing:-.03em;line-height:1;display:block;font-variant-numeric:tabular-nums}
.cd .nums span{font-size:14px;color:var(--muted)}

/* about */
.about{display:grid;grid-template-columns:1fr 1.1fr;gap:56px;align-items:start}
.photo-card{position:relative;padding:0 0 48px}
.photo{aspect-ratio:4/5;max-width:100%;border-radius:var(--r,22px);background:var(--soft) center/cover;box-shadow:-14px 14px 0 var(--soft);display:grid;place-items:center;color:var(--muted);font-size:15px;text-align:center;padding:24px}
.nametag{position:absolute;left:24px;right:24px;bottom:0;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.nametag b{font-family:var(--display);font-size:24px;letter-spacing:-.03em;display:block;line-height:1.2}
.nametag span{color:var(--muted);font-size:15px}
.nametag svg{width:30px;color:var(--wine);flex:none}
.about h2 .w{display:block}
.about .intro{font-size:22px;line-height:1.45;margin:24px 0;color:var(--ink)}
.story p{color:var(--muted);margin:0 0 1.1em;max-width:62ch}
.story p b{color:var(--ink)}
.story .more{display:none}
.story.open .more{display:block}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}
.chip{background:var(--soft);border-radius:999px;padding:10px 18px;font-size:15px;color:var(--ink);display:inline-flex;gap:8px;align-items:center}
.linkw{color:var(--wine);font-weight:600;text-decoration:none;display:inline-flex;gap:10px;align-items:center;background:none;border:0;font:600 16px var(--body);cursor:pointer;padding:0}

/* prizes */
.plist{display:grid;gap:20px;margin-top:36px}
.pcard{border-radius:var(--r,22px);padding:36px;display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;min-width:0}
.pcard.one{background:var(--soft)}
.pcard.two{background:var(--wine-soft)}
.pcard .pos{font-family:var(--display);font-size:30px;font-weight:700;display:flex;gap:16px;align-items:center;letter-spacing:-.02em}
.pcard .pos small{font:700 13px var(--body);letter-spacing:.2em;text-transform:uppercase}
.pcard h3{font-size:clamp(30px,4.4vw,42px);margin:16px 0 10px}
.pcard p{margin:0;color:var(--muted);font-size:17px}
.pcard svg,.pcard img{width:clamp(120px,20vw,200px);height:auto;border-radius:var(--rb,10px)}
.pcard.one{background:#0b0b0d;color:#fff}.pcard.one p{color:#b9bccb}
.styles{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--card);border-bottom:1px solid var(--line);padding-block:10px}
.styles .wrap{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.styles b{margin-right:4px}
.sbtn{border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:7px 14px;font:600 14px var(--body);cursor:pointer}
.sbtn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#app{background:var(--bg);color:var(--ink);min-height:100vh}

/* steps */
.steps{display:grid;gap:36px;margin-top:40px;max-width:640px}
.step{display:grid;grid-template-columns:64px 1fr;gap:24px;align-items:start}
.step .n{width:64px;height:64px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:17px}
.step h3{font-family:var(--body);letter-spacing:-.01em;font-weight:700;font-size:21px;margin:6px 0 8px}
.step p{margin:0;color:var(--muted);font-size:17px}

/* buy */
.buy-sec{background:var(--soft)}
.deadline{display:flex;gap:16px;align-items:center;margin:24px 0 32px}
.deadline svg{width:38px;flex:none}
.deadline b{display:block;font-size:17px}
.deadline span{color:var(--muted);font-size:15px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r,22px);overflow:hidden;max-width:760px}
.panel-head{padding:28px 32px;border-bottom:1px solid var(--line)}
.panel-head .t{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-weight:600;font-size:18px}
.panel-head .t span{color:var(--muted);font-size:14px;font-weight:400}
.tabs{display:flex;justify-content:space-between;gap:8px;margin-top:22px;flex-wrap:wrap}
.tab{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:15px}
.tab i{width:38px;height:38px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-style:normal;flex:none}
.tab.on{color:var(--ink);font-weight:700}
.tab.on i{background:var(--navy);color:var(--on-navy)}
.tab.done i{background:var(--wine);color:#fff}
.panel-body{padding:32px}
.panel-body h3{font-size:clamp(28px,4vw,38px);margin:4px 0 8px}
.panel-body .hint{color:var(--muted);margin:0 0 24px}
.kicker{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:600}
.fld{display:flex;flex-direction:column;gap:8px;margin-bottom:22px}
.fld label{font-weight:700;font-size:17px}
.fld input{font:18px var(--body);padding:18px 20px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);width:100%}
.fld small{color:var(--muted);font-size:14px}
.phone{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.phone span{padding:0 18px;color:var(--muted);border-right:1px solid var(--line);font-size:18px}
.phone input{border:0;border-radius:0}
.qtyrow{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.qty{display:flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.qty button{width:64px;height:64px;border:0;background:var(--soft);color:var(--ink);font-size:28px;cursor:pointer}
.qty output{width:90px;display:grid;place-items:center;font-size:24px;font-weight:600}
.money{font-family:var(--display);font-size:36px;letter-spacing:-.03em}
.money small{font:500 14px var(--body);color:var(--muted);letter-spacing:0}
.panel-foot{border-top:1px solid var(--line);margin-top:28px;padding-top:24px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.panel-foot .sum small{color:var(--muted);font-size:14px;display:block}
.trust{background:var(--soft);text-align:center;color:var(--muted);font-size:14px;padding-block:14px;padding-left:16px;padding-right:16px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin-bottom:16px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:6px;border:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px;max-height:380px;overflow-y:auto;padding:2px}
.num{font:600 15px var(--body);font-variant-numeric:tabular-nums;padding:11px 0;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.num:hover{border-color:var(--navy)}
.num.sold{background:var(--soft);color:var(--muted);text-decoration:line-through;cursor:not-allowed;border-color:transparent}
.num.pick{background:var(--navy);color:var(--on-navy);border-color:var(--navy)}
.admin-on .num.sold{cursor:pointer;background:var(--wine-soft);color:var(--wine)}
.rand{margin-top:12px}
.dep{display:grid;gap:10px;margin:20px 0}
.field{border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;min-width:0}
.field .k{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}
.field .v{font-size:17px;font-weight:600;word-break:break-all;font-variant-numeric:tabular-nums}
.field .v.empty{color:var(--muted);font-weight:400;font-style:italic;font-size:15px}
.copy{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:8px 12px;font:600 13px var(--body);cursor:pointer;flex:none}
.msgbox{background:var(--soft);border-radius:12px;padding:16px;font-size:15px;color:var(--ink);margin-bottom:16px}

/* faq */
.faq{max-width:780px;margin-top:32px}
details{border-bottom:1px solid var(--line)}
summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:16px;padding-block:24px;font-size:19px;font-weight:600}
summary::-webkit-details-marker{display:none}
summary::after{content:"";width:10px;height:10px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);flex:none;margin-right:6px;transition:transform .2s}
details[open] summary::after{transform:rotate(-135deg)}
details p{margin:0 0 24px;color:var(--muted);font-size:17px;max-width:64ch}

/* admin */
.admin{background:var(--card);border:2px solid var(--wine);border-radius:18px;padding:24px;margin-top:32px;max-width:760px}
.admin h3{font-family:var(--body);letter-spacing:0;font-size:19px}
.admin .g{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:16px 0}
.admin label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:600}
.admin input{font:15px var(--body);padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.admin .msg{font-size:14px;margin-top:10px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:10px;font-size:15px;z-index:20}
footer{padding-block:40px;color:var(--muted);font-size:14px;border-top:1px solid var(--line)}


/* Estilo A · Adoración: violeta del altar y oro, display serif */
#app.s-a{--bg:#f7f5fb;--card:#fff;--soft:#eeeaf7;--ink:#2a1f4d;--muted:#6c6489;--line:#e2dcf0;--wine:#5b3fb0;--wine-soft:#f4ecd6;--navy:#2a1f4d;--on-navy:#fff;--gold:#c8a24a;--display:"Cormorant Garamond",Georgia,serif;--dw:700;--dls:-.01em;--dt:none;--r:28px;--rb:999px}
/* Estilo B · Misión: azul sudadera, amarillo paliacate y rojo, display condensado en mayúsculas */
#app.s-b{--bg:#fbfaf6;--card:#fff;--soft:#f0eee6;--ink:#121c33;--muted:#5f6577;--line:#e3e0d6;--wine:#d93a2b;--wine-soft:#fbefb8;--navy:#121c33;--on-navy:#fff;--gold:#f2c418;--display:"Archivo","Arial Narrow",sans-serif;--dw:900;--dls:-.02em;--dt:uppercase;--r:6px;--rb:4px}
/* Estilo C · Fresco: cielo claro, redondeado y amable */
#app.s-c{--bg:#f2f8fd;--card:#fff;--soft:#e2eef9;--ink:#0f3048;--muted:#5a7183;--line:#d6e5f1;--wine:#2b7bd6;--wine-soft:#e3f4ec;--navy:#0f3048;--on-navy:#fff;--gold:#f3b33d;--display:"Bricolage Grotesque",system-ui,sans-serif;--dw:800;--dls:-.04em;--dt:none;--r:32px;--rb:16px}
@media (prefers-color-scheme: dark){
 :root:not([data-theme="light"]) #app.s-a{--bg:#141022;--card:#1d1832;--soft:#261f40;--ink:#ece8f8;--muted:#a59fc0;--line:#332a52;--wine:#a98cff;--wine-soft:#3a3120;--navy:#3b2d72}
 :root:not([data-theme="light"]) #app.s-b{--bg:#0f131d;--card:#171c29;--soft:#1f2535;--ink:#eef0f5;--muted:#a1a7b8;--line:#2a3144;--wine:#ff6a5a;--wine-soft:#3a3412;--navy:#22315a}
 :root:not([data-theme="light"]) #app.s-c{--bg:#0d1822;--card:#132331;--soft:#1a2e40;--ink:#e6f1fa;--muted:#94abbd;--line:#24394c;--wine:#6aaef5;--wine-soft:#173326;--navy:#1d4566}}
:root[data-theme="dark"] #app.s-a{--bg:#141022;--card:#1d1832;--soft:#261f40;--ink:#ece8f8;--muted:#a59fc0;--line:#332a52;--wine:#a98cff;--wine-soft:#3a3120;--navy:#3b2d72}
:root[data-theme="dark"] #app.s-b{--bg:#0f131d;--card:#171c29;--soft:#1f2535;--ink:#eef0f5;--muted:#a1a7b8;--line:#2a3144;--wine:#ff6a5a;--wine-soft:#3a3412;--navy:#22315a}
:root[data-theme="dark"] #app.s-c{--bg:#0d1822;--card:#132331;--soft:#1a2e40;--ink:#e6f1fa;--muted:#94abbd;--line:#24394c;--wine:#6aaef5;--wine-soft:#173326;--navy:#1d4566}
#app.s-a .pticket{transform:none}#app.s-a .badge{display:none}#app.s-a .pticket .big{text-shadow:none;font-style:italic}

function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2400)}
function copy(text){
  const fallback=()=>{toast("No se pudo copiar automáticamente. Mantén presionado el texto para copiarlo.")};
  try{navigator.clipboard.writeText(text).then(()=>toast("Copiado"),fallback)}catch(e){fallback()}
}

function gridHTML(){

  Array.from({length:TOTAL},(_,i)=>{const n=i+1,s=ss.has(n),a=!s&&as.has(n),p=picks.has(n);const off=(s||a)&&!admin;return `<button class="num${s?" sold":""}${a?" apart":""}${p?" pick":""}" data-n="${n}" aria-pressed="${p}" aria-label="Boleto ${n}${s?", vendido":a?", apartado":""}" ${off?"disabled":""}>${pad(n)}</button>`}).join("")+`</div>`;
}

    const f=new File([b],"boleto-rifa-"+nums.map(pad).join("-")+".png",{type:"image/png"});
    if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:"Mi boleto de la rifa"}).catch(()=>{});return}
    const u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download=f.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast("Boleto guardado")},"image/png");
}
async function shrink(file){
  if(!/^image\/(jpeg|png|webp)$/.test(file.type))return file;
  try{const url=URL.createObjectURL(file);const img=await new Promise((ok,ko)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=ko;i.src=url});
    const sc=Math.min(1,1800/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
    return await new Promise(ok=>c.toBlob(b=>ok(b||file),"image/jpeg",.85))}catch(_){return file}
}
async function uploadProof(file){
  if(!sb){upMsg="No se pudo conectar. Mándalo por WhatsApp.";rerenderBuy();return}
  upState="subiendo";upMsg="";rerenderBuy();
  const f=await shrink(file);const ext=f.type==="application/pdf"?"pdf":(f.type==="image/jpeg"?"jpg":(f.type.split("/")[1]||"jpg"));
  const nums=[...picks].sort((a,b)=>a-b);const path=`c/${Date.now()}-${Math.random().toString(36).slice(2,8)}-${nums.join("_")}.${ext}`;
  const up=await sb.storage.from("rifa-comprobantes").upload(path,f,{contentType:f.type||"image/jpeg",upsert:false});
  if(up.error){upState="";upMsg="No se pudo subir. Intenta otra vez o mándalo por WhatsApp.";rerenderBuy();return}
  await sb.rpc("rifa_comprobante",{p_nums:nums,p_path:path});
  upState="ok";rerenderBuy();
}
async function viewProof(path){
  const w=window.open("","_blank");
  const {data,error}=await sb.storage.from("rifa-comprobantes").createSignedUrl(path,600);
  if(error||!data){if(w)w.close();toast("No se pudo abrir el comprobante.");return}
  if(w)w.location=data.signedUrl;else location.href=data.signedUrl;
}
async function persistSold(n,had){
  const r=had?await sb.from("rifa_vendidos").delete().eq("numero",n):await sb.from("rifa_vendidos").insert({numero:n});
  if(!r.error&&!had){await sb.from("rifa_apartados").delete().eq("numero",n);apRows=apRows.filter(x=>x.numero!==n);safeRender()}
  if(r.error){const i=S.sold.indexOf(n); had?S.sold.push(n):(i>=0&&S.sold.splice(i,1)); S.sold.sort((a,b)=>a-b); render(); toast("No se pudo guardar el boleto "+pad(n)+". Revisa tu conexión.")}
}
async function sendLink(){
  const e=loginEmail.toLowerCase();
  if(!ADMINS.includes(e)){loginMsg="Ese correo no tiene acceso a administrar la rifa.";render();return}
  if(!sb){loginMsg="No se pudo conectar. Recarga la página.";render();return}
  loginMsg="Enviando…";render();
  const {error}=await sb.auth.signInWithOtp({email:e,options:{emailRedirectTo:location.origin+location.pathname}});
  loginMsg=error?"No se pudo enviar el link. Espera un minuto e inténtalo otra vez.":"Listo. Revisa tu correo y abre el link desde este mismo navegador.";
  render();
}
async function loadData(){
  const [c,v]=await Promise.all([sb.from("rifa_config").select("*").eq("id",1).maybeSingle(),sb.from("rifa_vendidos").select("numero")]);
  if(c.data){["banco","titular","clabe","tarjeta","wa"].forEach(k=>S[k]=c.data[k]||"")}
  if(v.data){S.sold=v.data.map(r=>r.numero).sort((a,b)=>a-b)}
  const ap=await sb.rpc("rifa_apartados_publicos"); if(!ap.error&&ap.data){S.apartados=ap.data.map(x=>typeof x==="number"?x:Object.values(x)[0]).filter(n=>!S.sold.includes(n))}
  if(canEdit){const r=await sb.from("rifa_apartados").select("*").order("created_at",{ascending:true}); if(!r.error&&r.data)apRows=r.data.filter(x=>!S.sold.includes(x.numero))
    const pl=await sb.storage.from("rifa-comprobantes").list("c",{limit:1000,sortBy:{column:"created_at",order:"desc"}});
    if(!pl.error&&pl.data)proofs=pl.data.filter(f=>f.name&&!f.name.startsWith(".")).map(f=>{const m=f.name.match(/-([0-9_]+)\.[a-z]+$/i);return {path:"c/"+f.name,nums:m?m[1].split("_").map(Number).filter(Boolean):[],at:f.created_at}})}
}
function setUser(session){
  sbUser=session&&session.user; const was=canEdit;
  canEdit=!!(sbUser&&ADMINS.includes(String(sbUser.email||"").toLowerCase()));
  if(!canEdit)admin=false;
  if(was!==canEdit){viewPublic=false;safeRender()}
}
async function save(){
  if(STATIC){const m=document.getElementById("amsg"); if(!sb||!canEdit){if(m)m.textContent="Inicia sesión para guardar.";return}
    if(m)m.textContent="Guardando…";
    const {error}=await sb.from("rifa_config").update({banco:S.banco||"",titular:S.titular||"",clabe:S.clabe||"",tarjeta:S.tarjeta||"",wa:S.wa||"",updated_at:new Date().toISOString()}).eq("id",1);
    if(m)m.textContent=error?"No se pudo guardar. Revisa tu conexión e intenta otra vez.":"Guardado. Ya se ve en la página.";
    if(!error){toast("Datos guardados")}
    return}
  const m=document.getElementById("amsg"); if(m)m.textContent="Publicando…";
  if(!artifactNs){if(m)m.textContent="No se puede guardar desde esta vista. Abre la página en claude.ai con tu cuenta.";return}
  try{await artifactNs.publish(buildDoc())}
  catch(err){const c=err&&err.code;
    if(m)m.textContent=c==="conflict"?"Alguien guardó antes; la página se recarga con la versión más nueva.":c==="not_writer"||c==="not_granted"?"Esta cuenta no tiene permiso para editar la página.":c==="too_large"?"La foto es muy pesada. Prueba con otra más ligera.":"No se pudo publicar. Intenta de nuevo en un momento."}
}

render();
(async()=>{try{
  if(STATIC){ if(!window.supabase)return;
    sb=window.supabase.createClient(SB_URL,SB_KEY);
    sb.auth.onAuthStateChange((_e,s)=>setUser(s));
    await loadData(); safeRender();
    const {data}=await sb.auth.getSession(); setUser(data.session);
    if(canEdit){await loadData();safeRender()}
    setInterval(async()=>{if(document.hidden)return;try{await loadData();safeRender()}catch(_){}},15000);
    document.addEventListener("visibilitychange",async()=>{if(!document.hidden){try{await loadData();safeRender()}catch(_){}}});
    return }
  if(!window.claude||!window.claude.use)return;
  const [u,a]=await Promise.all([window.claude.use("user"),window.claude.use("artifact")]);
  artifactNs=a; canEdit=u?await u.canEdit():false;
  if(canEdit)rerenderBuy();
}catch(e){}})();
})();
</script>
